[project]
name = "tagwerk"
version = "0.7.0"
description = "Automatic categorization, tagging and folder organization of electronic music for DJs"
requires-python = ">=3.10"
dependencies = ["essentia-tensorflow", "mutagen", "numpy"]

[project.scripts]
tagwerk = "tagwerk.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tagwerk"]
